<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>100 Mechanisms</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #24292f; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .item { padding: 12px 0; border-bottom: 1px solid #d0d7de; }
  h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 10px; }
  #back { display:inline-block; margin-bottom:20px; }
  #content img { max-width:100%; }
  pre { background:#f6f8fa; padding:16px; overflow:auto; border-radius:6px; }
  code { background:#f6f8fa; padding:2px 4px; border-radius:4px; }
</style>
</head>
<body>
<div id="app">Loading...</div>
<script>
const OWNER = 'seonghyeonOrNot';
const REPO = '100-mechanisms';
const BRANCH = 'main';

async function fetchMechanisms() {
  const res = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/mechanisms');
  if (!res.ok) return [];
  const data = await res.json();
  return data.filter(function(d){ return d.type === 'dir'; }).sort(function(a,b){ return a.name.localeCompare(b.name); });
}

async function fetchReadme(dirName) {
  const url = 'https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/' + BRANCH + '/mechanisms/' + dirName + '/README.md';
  const res = await fetch(url);
  if (!res.ok) return '# Not found';
  return await res.text();
}

function formatTitle(dirName) {
  const parts = dirName.split('-');
  const num = parts[0];
  const words = parts.slice(1).join(' ');
  return num + '. ' + words.replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

async function renderHome() {
  const app = document.getElementById('app');
  app.innerHTML = '<h1>100 Mechanisms</h1><p>기계 메커니즘 100개를 직접 설계하고 기록하는 프로젝트입니다.</p><div id="list">불러오는 중...</div>';
  const dirs = await fetchMechanisms();
  const list = document.getElementById('list');
  if (dirs.length === 0) {
    list.innerHTML = '<p>아직 등록된 항목이 없습니다.</p>';
    return;
  }
  list.innerHTML = dirs.map(function(d){
    return '<div class="item"><a href="#/mechanisms/' + d.name + '">' + formatTitle(d.name) + '</a></div>';
  }).join('');
}

async function renderDetail(dirName) {
  const app = document.getElementById('app');
  app.innerHTML = '<div id="back"><a href="#/">&larr; 목록으로</a></div><div id="content">불러오는 중...</div>';
  const md = await fetchReadme(dirName);
  document.getElementById('content').innerHTML = marked.parse(md);
}

function router() {
  const hash = window.location.hash;
  const match = hash.match(/^#\/mechanisms\/(.+)$/);
  if (match) {
    renderDetail(match[1]);
  } else {
    renderHome();
  }
}

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
router();
</script>
</body>
</html>
