<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>100 Mechanisms</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    color: #24292f;
    line-height: 1.6;
    background: #ffffff;
  }

  a {
    color: #0969da;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .hero {
    padding: 56px 0 40px;
    border-bottom: 1px solid #eaeef2;
    margin-bottom: 40px;
  }

  .hero-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 48px;
    flex-wrap: wrap;
  }

  .hero-text {
    flex: 1 1 380px;
    min-width: 280px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 44px;
    color: #0d1117;
  }

  .logo-icon {
    font-size: 22px;
  }

  .headline {
    font-size: 52px;
    font-weight: 800;
    line-height: 1.15;
    margin: 0;
    color: #0d1117;
  }

  .headline .accent {
    color: #0969da;
  }

  .hero-divider {
    width: 40px;
    height: 3px;
    background: #24292f;
    border: none;
    margin: 24px 0;
  }

  .hero-desc {
    font-size: 16px;
    color: #57606a;
    margin: 0 0 28px;
  }

  .cta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
  }

  .btn-primary {
    background: #0d1117;
    color: #ffffff;
  }

  .btn-primary:hover {
    background: #24292f;
    text-decoration: none;
  }

  .btn-outline {
    border: 1px solid #d0d7de;
    color: #0d1117;
  }

  .btn-outline:hover {
    background: #f6f8fa;
    text-decoration: none;
  }

  .hero-image {
    flex: 1 1 320px;
    min-width: 260px;
    text-align: center;
  }

  .hero-image img {
    max-width: 130%;
    height: auto;
  }

  main.wrap {
    padding-bottom: 60px;
  }

  .section-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 16px;
    color: #0d1117;
  }

  /* 목록 */
  .item {
    padding: 16px 0;
    border-bottom: 1px solid #d0d7de;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .item-link {
    font-size: 16px;
    font-weight: 500;
  }

  .item-date {
    flex-shrink: 0;
    font-size: 13px;
    color: #8c959f;
    white-space: nowrap;
  }

  /* 상세 상단 네비게이션 */
  .detail-nav {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    margin-bottom: 36px;
  }

  .detail-nav-left {
    justify-self: start;
  }

  .detail-nav-position {
    justify-self: center;
    font-size: 14px;
    font-weight: 600;
    color: #57606a;
    white-space: nowrap;
  }

  .detail-nav-actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .detail-nav a {
    font-size: 15px;
  }

  .detail-nav .disabled {
    color: #afb8c1;
    pointer-events: none;
    cursor: default;
  }

  #content h1 {
    border-bottom: 1px solid #d0d7de;
    padding-bottom: 10px;
  }

  #content img {
    max-width: 100%;
    height: auto;
  }

  pre {
    background: #f6f8fa;
    padding: 16px;
    overflow: auto;
    border-radius: 6px;
  }

  code {
    background: #f6f8fa;
    padding: 2px 4px;
    border-radius: 4px;
  }

  @media (max-width: 700px) {

    .headline {
      font-size: 34px;
    }

    .hero-inner {
      flex-direction: column;
    }

    .hero-image img {
      max-width: 100%;
    }

    .item {
      align-items: flex-start;
      gap: 12px;
    }

    .item-date {
      font-size: 12px;
    }

    .detail-nav {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "back position"
        "actions actions";
      row-gap: 16px;
    }

    .detail-nav-left {
      grid-area: back;
    }

    .detail-nav-position {
      grid-area: position;
      justify-self: end;
    }

    .detail-nav-actions {
      grid-area: actions;
      justify-self: end;
    }

  }
</style>
</head>

<body>

<section class="hero">
  <div class="wrap hero-inner">

    <div class="hero-text">

      <div class="logo">
        <span class="logo-icon">⚙️</span>
        100 Mechanisms
      </div>

      <h1 class="headline">
        Understand Motion.<br>
        Design Systems.<br>
        <span class="accent">Build Robots.</span>
      </h1>

      <hr class="hero-divider">

      <p class="hero-desc">
        기계 메커니즘을 분석하고 설계하며 기록합니다.
        움직임의 원리를 이해하고 실제 로봇 시스템으로 연결하는 오픈 프로젝트입니다.
      </p>

      <div class="cta">

        <a
          href="#/"
          class="btn btn-primary"
          onclick="
            var t = document.getElementById('list-section');
            if (t) {
              t.scrollIntoView({ behavior: 'smooth' });
            }
          "
        >
          Explore Motion Library &darr;
        </a>

        <a
          href="https://github.com/seonghyeonOrNot/100-mechanisms"
          target="_blank"
          rel="noopener"
          class="btn btn-outline"
        >
          View on GitHub
        </a>

      </div>
    </div>

    <div class="hero-image">
      <img
        src="hamster-hero3.png"
        alt="100 Mechanisms mascot"
      >
    </div>

  </div>
</section>


<main class="wrap">
  <div id="app">
    Loading...
  </div>
</main>


<script>

const OWNER = 'seonghyeonOrNot';
const REPO = '100-mechanisms';
const BRANCH = 'main';


/* =========================
   메커니즘 폴더 목록
========================= */

async function fetchMechanisms() {

  const url =
    'https://api.github.com/repos/' +
    OWNER + '/' +
    REPO +
    '/contents/mechanisms';

  const res = await fetch(url);

  if (!res.ok) {
    return [];
  }

  const data = await res.json();

  return data
    .filter(function(d) {
      return d.type === 'dir';
    })
    .sort(function(a, b) {
      return a.name.localeCompare(b.name);
    });

}


/* =========================
   README 가져오기
========================= */

async function fetchReadme(dirName) {

  const url =
    'https://raw.githubusercontent.com/' +
    OWNER + '/' +
    REPO + '/' +
    BRANCH +
    '/mechanisms/' +
    dirName +
    '/README.md';

  const res = await fetch(url);

  if (!res.ok) {
    return '# Not found';
  }

  return await res.text();
}


/* =========================
   최신 수정일
========================= */

async function fetchLastUpdated(dirName) {

  const path =
    'mechanisms/' + dirName;

  const url =
    'https://api.github.com/repos/' +
    OWNER + '/' +
    REPO +
    '/commits?path=' +
    encodeURIComponent(path) +
    '&sha=' +
    encodeURIComponent(BRANCH) +
    '&per_page=1';

  try {

    const res = await fetch(url);

    if (!res.ok) {
      return null;
    }

    const commits = await res.json();

    if (!commits.length) {
      return null;
    }

    return commits[0].commit.committer.date;

  } catch (error) {

    console.error(
      'Last updated fetch error:',
      error
    );

    return null;
  }

}


/* =========================
   날짜 포맷
========================= */

function formatDate(dateString) {

  if (!dateString) {
    return '-';
  }

  const date = new Date(dateString);

  const formatted =
    new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }
    ).format(date);

  return formatted.replaceAll('-', '.');

}


/* =========================
   폴더명 → 제목
========================= */

function formatTitle(dirName) {

  const parts =
    dirName.split('-');

  const num =
    parts[0];

  const words =
    parts
      .slice(1)
      .join(' ');

  const title =
    words.replace(
      /\b\w/g,
      function(c) {
        return c.toUpperCase();
      }
    );

  return num + '. ' + title;

}


/* =========================
   HOME
========================= */

async function renderHome() {

  const app =
    document.getElementById('app');

  app.innerHTML =
    '<h2 class="section-title" id="list-section">' +
      'Motion Library' +
    '</h2>' +
    '<div id="list">' +
      '불러오는 중...' +
    '</div>';

  const dirs =
    await fetchMechanisms();

  const list =
    document.getElementById('list');

  if (dirs.length === 0) {

    list.innerHTML =
      '<p>아직 등록된 항목이 없습니다.</p>';

    return;
  }

  const items =
    await Promise.all(

      dirs.map(
        async function(d) {

          const updatedAt =
            await fetchLastUpdated(d.name);

          return (
            '<div class="item">' +

              '<a ' +
                'class="item-link" ' +
                'href="#/mechanisms/' +
                d.name +
              '">' +

                formatTitle(d.name) +

              '</a>' +

              '<span class="item-date">' +
                'Updated ' +
                formatDate(updatedAt) +
              '</span>' +

            '</div>'
          );

        }
      )

    );

  list.innerHTML =
    items.join('');

}


/* =========================
   DETAIL
========================= */

async function renderDetail(dirName) {

  const app =
    document.getElementById('app');

  app.innerHTML =
    '<div>불러오는 중...</div>';

  const dirs =
    await fetchMechanisms();

  const currentIndex =
    dirs.findIndex(function(d) {
      return d.name === dirName;
    });

  if (currentIndex === -1) {

    app.innerHTML =
      '<p>해당 메커니즘을 찾을 수 없습니다.</p>';

    return;
  }

  const prev =
    currentIndex > 0
      ? dirs[currentIndex - 1]
      : null;

  const next =
    currentIndex < dirs.length - 1
      ? dirs[currentIndex + 1]
      : null;


  /*
    현재 위치

    현재 등록 개수 기준이 아니라
    프로젝트 목표인 100을 기준으로 표시
  */

  const currentNumber =
    String(currentIndex + 1).padStart(3, '0');

  const positionText =
    currentNumber + ' / 100';


  const prevHtml =
    prev
      ? (
          '<a href="#/mechanisms/' +
          prev.name +
          '">&larr; 이전</a>'
        )
      : (
          '<span class="disabled">' +
          '&larr; 이전' +
          '</span>'
        );


  const nextHtml =
    next
      ? (
          '<a href="#/mechanisms/' +
          next.name +
          '">다음 &rarr;</a>'
        )
      : (
          '<span class="disabled">' +
          '다음 &rarr;' +
          '</span>'
        );


  app.innerHTML =

    '<div class="detail-nav">' +

      '<div class="detail-nav-left">' +
        '<a href="#/">&larr; 목록으로</a>' +
      '</div>' +

      '<div class="detail-nav-position">' +
        positionText +
      '</div>' +

      '<div class="detail-nav-actions">' +
        prevHtml +
        nextHtml +
      '</div>' +

    '</div>' +

    '<div id="content">' +
      '불러오는 중...' +
    '</div>';


  const md =
    await fetchReadme(dirName);


  document
    .getElementById('content')
    .innerHTML =
      marked.parse(md);


  window.scrollTo({
    top: 0,
    behavior: 'instant'
  });

}


/* =========================
   ROUTER
========================= */

function router() {

  const hash =
    window.location.hash;

  const match =
    hash.match(
      /^#\/mechanisms\/(.+)$/
    );


  if (match) {

    renderDetail(
      decodeURIComponent(match[1])
    );

  } else {

    renderHome();

  }

}


/* =========================
   EVENTS
========================= */

window.addEventListener(
  'hashchange',
  router
);


window.addEventListener(
  'DOMContentLoaded',
  function() {

    router();

  }
);

</script>

</body>
</html>
