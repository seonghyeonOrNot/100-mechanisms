<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Mechanisms</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;padding:0;color:#24292f;line-height:1.6;background:#fff}a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 24px}.hero{background:#fff;padding:56px 0 40px;border-bottom:1px solid #eaeef2}.hero-inner{display:flex;align-items:center;justify-content:space-between;gap:48px;flex-wrap:wrap}.hero-text{flex:1 1 380px;min-width:280px}.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-bottom:44px;color:#0d1117}.logo-icon{font-size:22px}.headline{font-size:52px;font-weight:800;line-height:1.15;margin:0;color:#0d1117}.headline .accent{color:#0969da}.hero-divider{width:40px;height:3px;background:#24292f;border:none;margin:24px 0}.hero-desc{font-size:16px;color:#57606a;margin:0 0 28px}.cta{display:flex;gap:12px;flex-wrap:wrap}.btn{display:inline-block;padding:12px 22px;border-radius:8px;font-weight:600;font-size:15px}.btn-primary{background:#0d1117;color:#fff}.btn-primary:hover{background:#24292f;text-decoration:none}.hero-image{flex:1 1 320px;min-width:260px;text-align:center}.hero-image img{max-width:130%;height:auto}.library-section{position:relative;min-height:500px;padding:56px 0 80px;overflow:hidden;background-color:#f6f8fa;border-top:1px solid #eaeef2;background-image:radial-gradient(circle,rgba(13,17,23,.045) .7px,transparent .8px);background-size:18px 18px}main.wrap{padding-bottom:60px}.section-title{font-size:26px;font-weight:750;margin:0 0 24px;color:#0d1117}.item{padding:18px 0;border-bottom:1px solid rgba(208,215,222,.9)}.item-link{font-size:16px;font-weight:600}.status-message{padding:24px 0;color:#57606a;font-size:15px}.status-error{color:#cf222e}.detail-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;margin-bottom:36px;padding-bottom:16px;border-bottom:1px solid rgba(208,215,222,.7)}.detail-nav-left{justify-self:start}.detail-nav-position{justify-self:center;font-size:14px;font-weight:600;color:#57606a;white-space:nowrap}.detail-nav-actions{justify-self:end;display:flex;align-items:center;gap:22px}.detail-nav a{font-size:15px}.detail-nav .disabled{color:#afb8c1;pointer-events:none;cursor:default;font-size:15px}#content{background:rgba(255,255,255,.72);border-radius:12px;padding:12px 24px 36px}#content h1{border-bottom:1px solid #d0d7de;padding-bottom:10px}#content img{max-width:100%;height:auto;border-radius:8px}pre{background:#f6f8fa;padding:16px;overflow:auto;border-radius:6px}code{background:#f6f8fa;padding:2px 4px;border-radius:4px}@media(max-width:700px){.headline{font-size:34px}.hero-inner{flex-direction:column}.hero-image img{max-width:100%}.library-section{padding:42px 0 64px;background-size:16px 16px}.detail-nav{grid-template-columns:1fr auto;grid-template-areas:'back position' 'actions actions';row-gap:16px}.detail-nav-left{grid-area:back}.detail-nav-position{grid-area:position;justify-self:end}.detail-nav-actions{grid-area:actions;justify-self:end}#content{padding:8px 12px 28px}}
</style>
</head>
<body>
<section class="hero"><div class="wrap hero-inner"><div class="hero-text"><div class="logo"><span class="logo-icon">⚙️</span>100 Mechanisms</div><h1 class="headline">Understand Motion.<br>Design Systems.<br><span class="accent">Build Robots.</span></h1><hr class="hero-divider"><p class="hero-desc">기계 메커니즘을 분석하고 설계하며 기록합니다. 움직임의 원리를 이해하고 실제 로봇 시스템으로 연결하는 오픈 프로젝트입니다.</p><div class="cta"><a href="#/" id="explore-button" class="btn btn-primary">Explore Motion Library ↓</a></div></div><div class="hero-image"><img src="hamster-hero3.png" alt="100 Mechanisms mascot"></div></div></section>
<section class="library-section" id="library-section"><main class="wrap"><div id="app">Loading...</div></main></section>
<script>
const OWNER='seonghyeonOrNot';
const REPO='100-mechanisms';
const BRANCH='main';
const MECHANISMS=['001-Slider-Crank '];
async function fetchReadme(dirName){const url='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/mechanisms/'+encodeURIComponent(dirName)+'/README.md';const res=await fetch(url);if(!res.ok)throw new Error('README를 불러오지 못했습니다.');return await res.text()}
function formatTitle(dirName){const parts=dirName.split('-');const num=parts[0];const words=parts.slice(1).join(' ');const title=words.replace(/\b\w/g,function(c){return c.toUpperCase()});return num+'. '+title}
function renderHome(scrollToLibrary=false){const app=document.getElementById('app');app.innerHTML='<h2 class="section-title" id="list-section">Motion Library</h2><div id="list"></div>';const list=document.getElementById('list');list.innerHTML=MECHANISMS.map(function(dirName){return '<div class="item"><a class="item-link" href="#/mechanisms/'+encodeURIComponent(dirName)+'">'+formatTitle(dirName)+'</a></div>'}).join('');if(scrollToLibrary){requestAnimationFrame(function(){document.getElementById('library-section').scrollIntoView({behavior:'instant',block:'start'})})}}
async function renderDetail(dirName){const library=document.getElementById('library-section');const beforeTop=library?library.getBoundingClientRect().top:null;const app=document.getElementById('app');const currentIndex=MECHANISMS.indexOf(dirName);if(currentIndex===-1){app.innerHTML='<div class="status-message status-error">해당 메커니즘을 찾을 수 없습니다.</div>';return}const prev=currentIndex>0?MECHANISMS[currentIndex-1]:null;const next=currentIndex<MECHANISMS.length-1?MECHANISMS[currentIndex+1]:null;const folderNumber=dirName.split('-')[0];const positionText=folderNumber+' / 100';const prevHtml=prev?'<a href="#/mechanisms/'+prev+'">&larr; 이전</a>':'<span class="disabled">&larr; 이전</span>';const nextHtml=next?'<a href="#/mechanisms/'+next+'">다음 &rarr;</a>':'<span class="disabled">다음 &rarr;</span>';app.innerHTML='<div class="detail-nav"><div class="detail-nav-left"><a href="#/" data-back-to-library="true">&larr; 목록으로</a></div><div class="detail-nav-position">'+positionText+'</div><div class="detail-nav-actions">'+prevHtml+nextHtml+'</div></div><div id="content">불러오는 중...</div>';try{const md=await fetchReadme(dirName);const content=document.getElementById('content');if(content)content.innerHTML=marked.parse(md)}catch(error){console.error(error);const content=document.getElementById('content');if(content)content.innerHTML='<div class="status-message status-error">README를 불러오지 못했습니다.</div>'}if(beforeTop!==null&&library){requestAnimationFrame(function(){const newTop=library.getBoundingClientRect().top;window.scrollBy({top:newTop-beforeTop,behavior:'instant'})})}}
let backToLibrary=false;
function router(){const hash=window.location.hash;const match=hash.match(/^#\/mechanisms\/(.+)$/);if(match){let dirName;try{dirName=decodeURIComponent(match[1])}catch(error){dirName=match[1]}renderDetail(dirName)}else{renderHome(backToLibrary);backToLibrary=false}}
document.getElementById('explore-button').addEventListener('click',function(event){event.preventDefault();if(window.location.hash!=='#/'){backToLibrary=true;window.location.hash='#/'}else{document.getElementById('library-section').scrollIntoView({behavior:'smooth',block:'start'})}});
document.addEventListener('click',function(event){const backLink=event.target.closest('[data-back-to-library]');if(!backLink)return;backToLibrary=true});
window.addEventListener('hashchange',router);
window.addEventListener('DOMContentLoaded',function(){router()});
</script>
</body>
</html>
